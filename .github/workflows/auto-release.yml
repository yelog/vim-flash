# Push vX.Y.Z (or vX.Y.Z-rc.1) to publish an installable GitHub Release.
# Marketplace uploads are performed manually using the release ZIP.
name: Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (v1.0.9; historical 1.0.8 also supported)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Test, Package and Release
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources at Tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      # Historical tags may predate these helpers. Run a manual rebuild from a
      # branch containing this workflow; read only the helpers from that branch.
      - name: Fetch Release Helpers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts

      - name: Select Release Helpers
        shell: bash
        run: |
          if [[ -d .release-tools/scripts ]]; then
            cp .release-tools/scripts/release.py "$RUNNER_TEMP/release.py"
          else
            cp scripts/release.py "$RUNNER_TEMP/release.py"
          fi

      - name: Validate Version and Release Notes
        run: python3 "$RUNNER_TEMP/release.py" --root "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Gradle Wrapper Validation
        uses: gradle/wrapper-validation-action@v3.5.0

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Test and Build Plugin
        run: ./gradlew test buildPlugin

      - name: Validate Plugin ZIP
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 "$RUNNER_TEMP/release.py" --root "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG" \
            --archive "build/distributions/vim-flash-$VERSION.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ env.RELEASE_TAG }}
          path: build/distributions/*.zip
          if-no-files-found: error

      # Upload to a draft first so users never see a release without its ZIP.
      # A retry can finish an existing draft without replacing a published ZIP.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          ASSET_NAME="vim-flash-$VERSION.zip"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi

          if gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/release.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/release.json" > /dev/null; then
              if jq -e --arg name "$ASSET_NAME" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/release.json" > /dev/null; then
                echo "Release $RELEASE_TAG already contains $ASSET_NAME; leaving it unchanged."
                exit 0
              fi
              echo "::error::Published release $RELEASE_TAG has no $ASSET_NAME. Inspect it before changing public assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          fi

          gh release upload "$RELEASE_TAG" "build/distributions/$ASSET_NAME" --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE" --draft=false
